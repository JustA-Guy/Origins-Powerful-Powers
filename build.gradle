plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	// Opens GameRules.Type's constructor for the whitelistFeedback gamerule (see the file for why).
	accessWidenerPath = file("src/main/resources/origins-powerful-powers.accesswidener")
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Origins (bundles Apoli + Calio internally).
	modImplementation "maven.modrinth:origins:${project.origins_version}"

	// Apoli/Calio are jar-in-jar inside Origins and no longer published standalone on Modrinth,
	// so we extract them from the Origins jar and depend on them locally so Loom can remap them.
	modImplementation files("libs/apoli-2.9.2+mc.1.20.x.jar")
	modImplementation files("libs/calio-1.11.2+mc.1.20.x.jar")
	// Cardinal Components is jar-in-jar inside Apoli. PowerHolderComponent extends its interfaces, so
	// touching it needs CCA at compile time; at runtime Apoli's bundled copy is used.
	modCompileOnly files("libs/cardinal-components-base-5.2.1.jar")
	modCompileOnly files("libs/cardinal-components-entity-5.2.1.jar")

	// Simple Voice Chat: soft/optional dependency. We compile against its plugin API but never
	// require it at runtime - our VoicechatPlugin entrypoint is only ever loaded by SVC itself,
	// so if SVC isn't installed our integration class is simply never touched.
	modCompileOnly "maven.modrinth:simple-voice-chat:${project.svc_version}"

	// Hardcore Revival: soft/optional dependency, same pattern as Simple Voice Chat above. We
	// compile against its HardcoreRevivalAPI but never require it at runtime - HcrCompat checks
	// FabricLoader.isModLoaded() before ever touching a Hardcore Revival class.
	modCompileOnly "maven.modrinth:hardcore-revival:${project.hcr_version}"

	// Styled Nicknames: soft/optional dependency, same pattern again. NicknameCompat checks
	// FabricLoader.isModLoaded() before touching its API; without it only real usernames are obfuscated.
	modCompileOnly "maven.modrinth:styled-nicknames:${project.styled_nicknames_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
